services:
  tprox:
    image: ghcr.io/sonroyaalmerol/m3u-stream-merger-proxy:latest
    container_name: YOUR_CONTAINER_NAME
    hostname: YOUR_CONTAINERS_HOSTNAME
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - CLEAR_ON_BOOT=true
      - SYNC_ON_BOOT=true
      - BASE_URL=http://YOUR_BASE_URL:THE_PORT/
      - SYNC_CRON=0 0 * * *
      - M3U_URL_1=YOUR_LOCAL_OR_REMOTE_M3U
      - M3U_MAX_CONCURRENCY_1=2
      - XTREAM_URL_2=YOUR_XTREAM_PROVIDER_URL
      - XTREAM_USERNAME_2=YOUR_XTREAM_USERNAME
      - XTREAM_PASSWORD_2=YOUR_XTREAM_PASSWORD
      - M3U_MAX_CONCURRENCY_2=1
      - SORTING_KEY=tvg-type # tvg-group, tvg-chno, tvg-id: default is Name
      - SORTING_DIRECTION=asc # desc: default is asc
      - MAX_RETRIES=5
      - RETRY_WAIT=5
      - STREAM_TIMEOUT=7
    ports:
      - YOUR_PORT:8080
    x-tls-static-certs: "TLS_CERT_FILE=/certs/cert.pem + TLS_KEY_FILE=/certs/key.pem, mount both files under /certs, map host 443 to 8080"
    x-tls-autocert: "TLS_DOMAIN=your.domain.com + TLS_CACHE_DIR=/config/certs, mount a writable dir at /config/certs, map host 80 and 443"
    restart: unless-stopped
